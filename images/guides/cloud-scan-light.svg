<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
<title id="title">What happens in a cloud scan</title><desc id="desc">Connect selected repositories, scan source without running it, discard source and keep the report.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#AA3C15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="480" height="480" rx="20" fill="#FCFAF8"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="24" y="24" width="432" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><circle cx="56" cy="60" r="18" fill="#FBE4D7"/><text x="56" y="66" font-size="20" font-weight="700" text-anchor="middle" fill="#AA3C15">1</text><text x="88" y="67" font-size="24" font-weight="700" fill="#241B15">Choose repositories</text><text x="88" y="94" font-size="20" fill="#685347">Connect the GitHub repositories</text><text x="88" y="116" font-size="20" fill="#685347">you want Iris Code to scan.</text><path d="M240 142 L240 162" stroke="#AA3C15" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="184" width="432" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><circle cx="56" cy="220" r="18" fill="#FBE4D7"/><text x="56" y="226" font-size="20" font-weight="700" text-anchor="middle" fill="#AA3C15">2</text><text x="88" y="227" font-size="24" font-weight="700" fill="#241B15">Read and scan source</text><text x="88" y="254" font-size="20" fill="#685347">Download source from GitHub.</text><text x="88" y="276" font-size="20" fill="#685347">Your code is never run.</text><path d="M240 302 L240 322" stroke="#AA3C15" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="344" width="432" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><circle cx="56" cy="380" r="18" fill="#FBE4D7"/><text x="56" y="386" font-size="20" font-weight="700" text-anchor="middle" fill="#AA3C15">3</text><text x="88" y="387" font-size="24" font-weight="700" fill="#241B15">Discard the source</text><text x="88" y="414" font-size="20" fill="#685347">Keep the scan report for review.</text><text x="88" y="436" font-size="20" fill="#685347">Delete the downloaded source.</text></g></svg>