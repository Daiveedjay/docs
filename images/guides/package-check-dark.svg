<svg xmlns="http://www.w3.org/2000/svg" width="480" height="608" viewBox="0 0 480 608" role="img" aria-labelledby="title desc">
<title id="title">Checking a package before installation</title><desc id="desc">Check the requested package version and act on allowed, blocked or not-checked results.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#FF976C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="480" height="608" rx="20" fill="#141210"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="24" y="24" width="432" height="112" rx="14" fill="#211E1B" stroke="#4D443E"/><circle cx="56" cy="60" r="18" fill="#3D251A"/><text x="56" y="66" font-size="20" font-weight="700" text-anchor="middle" fill="#FF976C">1</text><text x="88" y="67" font-size="24" font-weight="700" fill="#FFF7F1">Request a package</text><text x="88" y="94" font-size="20" fill="#D8C6B8">You or an agent asks to install</text><text x="88" y="116" font-size="20" fill="#D8C6B8">a particular package version.</text><path d="M240 142 L240 162" stroke="#FF976C" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="184" width="432" height="112" rx="14" fill="#211E1B" stroke="#4D443E"/><circle cx="56" cy="220" r="18" fill="#3D251A"/><text x="56" y="226" font-size="20" font-weight="700" text-anchor="middle" fill="#FF976C">2</text><text x="88" y="227" font-size="24" font-weight="700" fill="#FFF7F1">Check before installing</text><text x="88" y="254" font-size="20" fill="#D8C6B8">Check known risks and your policy.</text><text x="88" y="276" font-size="20" fill="#D8C6B8">Show when a check could not run.</text><path d="M240 302 L240 322" stroke="#FF976C" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="24" y="360" font-size="20" font-weight="700" fill="#FFF7F1">Act on the result</text><rect x="24" y="380" width="432" height="60" rx="12" fill="#211E1B" stroke="#4D443E"/><text x="40" y="405" font-size="20" font-weight="700" fill="#FFF7F1">Allowed</text><text x="40" y="427" font-size="20" fill="#D8C6B8">Proceed with this installation.</text><rect x="24" y="452" width="432" height="60" rx="12" fill="#211E1B" stroke="#4D443E"/><text x="40" y="477" font-size="20" font-weight="700" fill="#FFF7F1">Blocked</text><text x="40" y="499" font-size="20" fill="#D8C6B8">Review the reason and replacement.</text><rect x="24" y="524" width="432" height="60" rx="12" fill="#211E1B" stroke="#4D443E"/><text x="40" y="549" font-size="20" font-weight="700" fill="#FFF7F1">Not checked</text><text x="40" y="571" font-size="20" fill="#D8C6B8">Your policy decides: warn or block.</text></g></svg>