<svg xmlns="http://www.w3.org/2000/svg" width="480" height="626" viewBox="0 0 480 626" role="img" aria-labelledby="title desc">
<title id="title">Comparing a refactor with its starting point</title><desc id="desc">Compare both versions, check improvement and new problems, then act on the verdict.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#AA3C15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="480" height="626" rx="20" fill="#FCFAF8"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="24" y="24" width="204" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><text x="40" y="60" font-size="20" font-weight="700" fill="#241B15">Before your edits</text><text x="40" y="88" font-size="20" fill="#685347">Saved code and</text><text x="40" y="110" font-size="20" fill="#685347">plan settings</text><rect x="252" y="24" width="204" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><text x="268" y="60" font-size="20" font-weight="700" fill="#241B15">After your edits</text><text x="268" y="88" font-size="20" fill="#685347">Current code and</text><text x="268" y="110" font-size="20" fill="#685347">changed helpers</text><path d="M126 142 V160 H354 V142 M240 160 V183" stroke="#AA3C15" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="200" width="432" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><circle cx="56" cy="236" r="18" fill="#FBE4D7"/><text x="56" y="242" font-size="20" font-weight="700" text-anchor="middle" fill="#AA3C15">1</text><text x="88" y="243" font-size="24" font-weight="700" fill="#241B15">Compare the code</text><text x="88" y="270" font-size="20" fill="#685347">Real improvement, not line packing.</text><text x="88" y="292" font-size="20" fill="#685347">Broken connections and new findings.</text><path d="M240 318 L240 338" stroke="#AA3C15" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="24" y="378" font-size="20" font-weight="700" fill="#241B15">Read the verdict</text><rect x="24" y="398" width="432" height="60" rx="12" fill="#FFFFFF" stroke="#D8CDC4"/><text x="40" y="423" font-size="20" font-weight="700" fill="#241B15">Improved</text><text x="40" y="445" font-size="20" fill="#685347">Run tests and the gate.</text><rect x="24" y="470" width="432" height="60" rx="12" fill="#FFFFFF" stroke="#D8CDC4"/><text x="40" y="495" font-size="20" font-weight="700" fill="#241B15">Not improved</text><text x="40" y="517" font-size="20" fill="#685347">Review the approach and try again.</text><rect x="24" y="542" width="432" height="60" rx="12" fill="#FFFFFF" stroke="#D8CDC4"/><text x="40" y="567" font-size="20" font-weight="700" fill="#241B15">Regressed</text><text x="40" y="589" font-size="20" fill="#685347">Correct the reported problem.</text></g></svg>