<svg xmlns="http://www.w3.org/2000/svg" width="480" height="608" viewBox="0 0 480 608" role="img" aria-labelledby="title desc">
<title id="title">How verification integrity checks a change</title><desc id="desc">Iris Code keeps a starting point, compares the change with it, and reports any check that became weaker as a warning or a blocker.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#AA3C15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="480" height="608" rx="20" fill="#FCFAF8"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="24" y="24" width="432" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><circle cx="56" cy="60" r="18" fill="#FBE4D7"/><text x="56" y="66" font-size="20" font-weight="700" text-anchor="middle" fill="#AA3C15">1</text><text x="88" y="67" font-size="24" font-weight="700" fill="#241B15">Keep a starting point</text><text x="88" y="94" font-size="20" fill="#685347">Your last commit, or your files</text><text x="88" y="116" font-size="20" fill="#685347">when you asked the agent.</text><path d="M240 142 L240 162" stroke="#AA3C15" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="184" width="432" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><circle cx="56" cy="220" r="18" fill="#FBE4D7"/><text x="56" y="226" font-size="20" font-weight="700" text-anchor="middle" fill="#AA3C15">2</text><text x="88" y="227" font-size="24" font-weight="700" fill="#241B15">Compare the change</text><text x="88" y="254" font-size="20" fill="#685347">Look for tests, checks and rules</text><text x="88" y="276" font-size="20" fill="#685347">that are now weaker.</text><path d="M240 302 L240 322" stroke="#AA3C15" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="24" y="360" font-size="20" font-weight="700" fill="#241B15">Act on the result</text><rect x="24" y="380" width="432" height="60" rx="12" fill="#FFFFFF" stroke="#D8CDC4"/><text x="40" y="405" font-size="20" font-weight="700" fill="#241B15">Nothing weakened</text><text x="40" y="427" font-size="20" fill="#685347">Carry on as normal.</text><rect x="24" y="452" width="432" height="60" rx="12" fill="#FFFFFF" stroke="#D8CDC4"/><text x="40" y="477" font-size="20" font-weight="700" fill="#241B15">Warning</text><text x="40" y="499" font-size="20" fill="#685347">Shown to you; nothing is stopped.</text><rect x="24" y="524" width="432" height="60" rx="12" fill="#FFFFFF" stroke="#D8CDC4"/><text x="40" y="549" font-size="20" font-weight="700" fill="#241B15">Blocking</text><text x="40" y="571" font-size="20" fill="#685347">Agent sent back once; push refused.</text></g></svg>
