<svg xmlns="http://www.w3.org/2000/svg" width="480" height="592" viewBox="0 0 480 592" role="img" aria-labelledby="title desc">
<title id="title">Working through a refactor plan</title><desc id="desc">Four steps from saved code to a reviewed, verified and tested change.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#AA3C15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="480" height="592" rx="20" fill="#FCFAF8"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="24" y="24" width="432" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><circle cx="56" cy="60" r="18" fill="#FBE4D7"/><text x="56" y="66" font-size="20" font-weight="700" text-anchor="middle" fill="#AA3C15">1</text><text x="88" y="67" font-size="24" font-weight="700" fill="#241B15">Get a plan</text><text x="88" y="94" font-size="20" fill="#685347">Keep a saved starting point.</text><text x="88" y="116" font-size="20" fill="#685347">Read the proposed changes.</text><path d="M240 142 L240 162" stroke="#AA3C15" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="168" width="432" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><circle cx="56" cy="204" r="18" fill="#FBE4D7"/><text x="56" y="210" font-size="20" font-weight="700" text-anchor="middle" fill="#AA3C15">2</text><text x="88" y="211" font-size="24" font-weight="700" fill="#241B15">Make one change</text><text x="88" y="238" font-size="20" fill="#685347">Apply an offered small fix, or</text><text x="88" y="260" font-size="20" fill="#685347">make a change you have reviewed.</text><path d="M240 286 L240 306" stroke="#AA3C15" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="312" width="432" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><circle cx="56" cy="348" r="18" fill="#FBE4D7"/><text x="56" y="354" font-size="20" font-weight="700" text-anchor="middle" fill="#AA3C15">3</text><text x="88" y="355" font-size="24" font-weight="700" fill="#241B15">Verify the result</text><text x="88" y="382" font-size="20" fill="#685347">Compare with the starting point.</text><text x="88" y="404" font-size="20" fill="#685347">Correct problems and check again.</text><path d="M240 430 L240 450" stroke="#AA3C15" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="456" width="432" height="112" rx="14" fill="#FFFFFF" stroke="#D8CDC4"/><circle cx="56" cy="492" r="18" fill="#FBE4D7"/><text x="56" y="498" font-size="20" font-weight="700" text-anchor="middle" fill="#AA3C15">4</text><text x="88" y="499" font-size="24" font-weight="700" fill="#241B15">Run tests and the gate</text><text x="88" y="526" font-size="20" fill="#685347">Check behaviour with your tests.</text><text x="88" y="548" font-size="20" fill="#685347">Confirm the standard still passes.</text></g></svg>