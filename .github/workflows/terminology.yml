# The docs site deploys from main the moment it is pushed, so this is the only
# thing standing between a vocabulary slip and the live site. It runs on every
# push and pull request.
name: Terminology

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  terminology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check_terminology.mjs
